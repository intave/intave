name: Self-tests

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  should-run:
    runs-on: ubuntu-latest
    outputs:
      run-tests: ${{ steps.check.outputs.run-tests }}
    steps:
      - name: Skip push when the commit has an open pull request
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "push" ]; then
            echo "run-tests=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          open_prs=$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
            --jq '[.[] | select(.state == "open")] | length')

          echo "run-tests=$([ "$open_prs" -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  versions:
    needs: should-run
    if: needs.should-run.outputs.run-tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle
      - name: Export configured Paper versions
        id: matrix
        run: |
          ./gradlew exportPaperTestMatrix
          echo "matrix=$(cat build/paper-test-matrix.json)" >> "$GITHUB_OUTPUT"

  test:
    needs: [should-run, versions]
    if: needs.should-run.outputs.run-tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.versions.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-java@v6
        with:
          java-version: '16'
          distribution: 'temurin'
          cache-jdk: true

      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - uses: actions/cache@v6
        with:
          path: |
            runs/test_*/cache/*.jar
            runs/test_*/versions/**.jar
            runs/test_*/libraries/**.jar
          key: mc-${{matrix.version}}-${{ hashFiles(format('libs/*-{0}*jar', matrix.version), format('libs/servers/*-{0}*jar', matrix.version)) }}

      - name: Run Paper self-test
        env:
          MINECRAFT_VERSION: ${{ matrix.version }}
        run: ./gradlew "testPaper${MINECRAFT_VERSION//./_}"
