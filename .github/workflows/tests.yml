name: Self-tests

on:
  push:
  pull_request:

jobs:
  versions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle
      - name: Export configured Paper versions
        id: matrix
        run: |
          ./gradlew exportPaperTestMatrix
          echo "matrix=$(cat build/paper-test-matrix.json)" >> "$GITHUB_OUTPUT"

  test:
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.versions.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-java@v6
        with:
          java-version: '16'
          distribution: 'temurin'
          cache-jdk: true

      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - uses: actions/cache@v6
        with:
          path: |
            runs/test_*/cache/*.jar
            runs/test_*/versions/**.jar
            runs/test_*/libraries/**.jar
          key: mc-${{matrix.version}}-${{ hashFiles(format('libs/*-{0}*jar', matrix.version), format('libs/servers/*-{0}*jar', matrix.version)) }}

      - name: Run Paper self-test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MINECRAFT_VERSION: ${{ matrix.version }}
        run: ./gradlew "testPaper${MINECRAFT_VERSION//./_}"
