name: Build and Release

# Pushes/PRs build artifacts. Tags prepare drafts; publishing a draft mirrors its assets.
# The nightly schedule updates dev builds automatically.
on:
  push:
    branches: [ "master" ]
    tags: [ "**", "!dev-build", "!nightly", "!nightly-build" ]
  pull_request:
    branches: [ "master" ]
  release:
    types: [ published ]
  schedule:
    # Nightly at 00:00 UTC (01:00 CET / 02:00 CEST).
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      publish_nightly:
        description: Publish the nightly build
        required: false
        default: false
        type: boolean

# Serialize builds of the same ref so an older upload cannot finish after a newer one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish
    if: >-
      github.event_name != 'release' ||
      (github.repository == 'intave/intave' &&
      github.event.release.tag_name != 'dev-build' &&
      github.event.release.tag_name != 'nightly' &&
      github.event.release.tag_name != 'nightly-build')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. Build both distributions, or download the exact assets you approved on GitHub.
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 21
        if: github.event_name != 'release'
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Check publishing scripts
        run: node --test .github/scripts/*.test.cjs

      - name: Build with Gradle
        if: github.event_name != 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew build

      - name: Determine artifact suffix
        if: github.event_name != 'release'
        id: vars
        run: echo "sha_short=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Upload minimal JAR artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v7
        with:
          name: Intave-${{ steps.vars.outputs.sha_short }}.jar
          path: build/libs/Intave.jar
          archive: false
          retention-days: 7

      - name: Upload bundled JAR artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v7
        with:
          name: Intave-bundled-${{ steps.vars.outputs.sha_short }}.jar
          path: build/libs/Intave-bundled.jar
          archive: false
          retention-days: 7

      - name: Download manually approved release assets
        id: approved_release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release download --repo "$GITHUB_REPOSITORY" --dir build/libs \
            --pattern Intave.jar --pattern Intave-bundled.jar -- "$RELEASE_TAG"
          test -s build/libs/Intave.jar
          test -s build/libs/Intave-bundled.jar

      # 2. A release tag prepares a draft. Publishing it manually starts directory uploads.
      # Keep the moving development tags out of this path, including manual runs.
      - name: Check whether the tag still needs a draft
        id: draft
        if: >-
          github.event_name != 'release' && startsWith(github.ref, 'refs/tags/') &&
          github.ref_name != 'dev-build' && github.ref_name != 'nightly' &&
          github.ref_name != 'nightly-build'
        uses: actions/github-script@v8
        with:
          script: |
            const tag = context.ref.slice('refs/tags/'.length);
            const releases = await github.paginate(github.rest.repos.listReleases, {
              ...context.repo, per_page: 100,
            });
            const published = releases.some(release => release.tag_name === tag && !release.draft);
            core.setOutput('prepare', published ? 'false' : 'true');
            if (published) core.notice('This tag is already published; leaving the approved release unchanged.');

      - name: Prepare tagged GitHub release draft
        if: steps.draft.outputs.prepare == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/libs/Intave.jar
            build/libs/Intave-bundled.jar
          generate_release_notes: true
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 3. The nightly schedule or an explicit manual request refreshes the shared development release.
      - name: Check nightly build is still current
        id: dev_build
        if: >-
          github.repository == 'intave/intave' &&
          github.ref == 'refs/heads/master' &&
          (github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && inputs.publish_nightly))
        uses: actions/github-script@v8
        with:
          script: |
            const { data: branch } = await github.rest.repos.getBranch({
              ...context.repo,
              branch: 'master',
            });
            const publish = branch.commit.sha === context.sha;
            if (!publish) {
              core.notice('Skipping dev build release because master has a newer commit.');
            }
            core.setOutput('publish', publish ? 'true' : 'false');

      - name: Move nightly-build tag to built commit
        if: steps.dev_build.outputs.publish == 'true'
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          git tag --force nightly-build "$BUILD_SHA"
          git push --force origin refs/tags/nightly-build

      - name: Replace Nightly Build assets and notes
        id: dev_release
        if: steps.dev_build.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-build
          name: Nightly Build
          overwrite_files: true
          files: |
            build/libs/Intave.jar
            build/libs/Intave-bundled.jar
          body: |
            Latest development build from master.
            Install one build: Intave.jar downloads and caches libraries; Intave-bundled.jar includes libraries and all supported classloader natives.
            Commit: ${{ github.sha }}
            Build: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 4. Mirror manually approved tags or automatic nightly builds to plugin directories.
      # Version lookup and changelog preparation live beside the Hangar publisher.
      - name: Prepare Modrinth version
        id: modrinth
        if: >-
          github.repository == 'intave/intave' &&
          (steps.approved_release.outcome == 'success' || steps.dev_release.outcome == 'success')
        uses: actions/github-script@v8
        env:
          MODRINTH_ID: ${{ vars.MODRINTH_ID || secrets.MODRINTH_ID }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        with:
          script: |
            const prepare = require('./.github/scripts/prepare-modrinth.cjs');
            await prepare({ core, context, github });

      - name: Publish to Modrinth
        if: steps.modrinth.outputs.publish == 'true'
        uses: Kir-Antipov/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID || secrets.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-featured: ${{ steps.modrinth.outputs.featured }}
          modrinth-unfeature-mode: none
          files: |
            build/libs/Intave.jar
            build/libs/Intave-bundled.jar
          name: Intave ${{ steps.modrinth.outputs.version }}
          version: ${{ steps.modrinth.outputs.version }}
          version-type: ${{ steps.modrinth.outputs.version_type }}
          changelog: ${{ steps.modrinth.outputs.changelog }}
          environment: server
          loaders: |
            bukkit
            spigot
            paper
            purpur
            folia
          game-versions: '>=1.8 <=26.3'

      - name: Publish to Hangar
        # Attempt Hangar even if Modrinth failed, but only after a successful GitHub release.
        if: >-
          !cancelled() && github.repository == 'intave/intave' &&
          (steps.approved_release.outcome == 'success' || steps.dev_release.outcome == 'success')
        uses: actions/github-script@v8
        env:
          HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}
        with:
          script: |
            const publish = require('./.github/scripts/publish-hangar.cjs');
            await publish({ core, context, github });
